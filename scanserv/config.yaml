name: Brother Scanner
version: "1.0.0"
slug: brother_scanner
description: Web scanning (scanservjs + SANE) for USB Brother scanners such as the DCP-1510, using the open-source brscan backend
url: https://github.com/warren-pistorius/ha-scan-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
usb: true
ingress: true
ingress_port: 8080
panel_icon: mdi:scanner
panel_title: Scanner
panel_admin: false
map:
  - type: share
    read_only: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Direct web UI on the LAN without a Home Assistant login (disabled by default)
options:
  output_dir: /share/scans
  ocr_lang: eng
  debug: false
  nas_copy: false
  nas_share: //192.168.68.95/warren
  nas_path: documents/scans
  nas_username: warren
schema:
  output_dir: match(^/share/.+)
  ocr_lang: str
  debug: bool
  nas_copy: bool
  nas_share: match(^//[^/]+/[^/]+$)
  nas_path: str?
  nas_username: str?
  nas_password: password?
